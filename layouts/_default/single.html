{{ define "main" }}
<article>
  <header class="mb-4 bg-primary-600">
    <h1 class="px-4 py-16 text-5xl font-black text-center text-white capitalize">
      {{ .Title }}
    </h1>
  </header>

  <div class="px-6 pt-6 pb-16 mx-auto max-w-5xl">
    {{ if eq .File.BaseFileName "contact" }}
      {{ partial "contact-form.html" . }}
    {{ else }}
      <div class="prose dark:prose-invert dark:text-white">
        {{ .Content }}
      </div>
    {{ end }}
  </div>
</article>
{{ end }}
